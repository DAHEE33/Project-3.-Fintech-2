version: '3.8'

services:
  easypay:
    build: 
      context: .              # Dockerfile이 있는 폴더
      dockerfile: Dockerfile  # 파일명이 다르면 여기에 맞춰 넣기
    image: easypay:latest
    container_name: fintech-app
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # AWS RDS 엔드포인트 사용
      - SPRING_DATASOURCE_URL=jdbc:postgresql://your-rds-endpoint.amazonaws.com:5432/easypay
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_started
    networks:
      - easypay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  # DB 서비스 제거 - AWS RDS 사용

  redis:
    image: redis:7-alpine
    container_name: easypay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - easypay-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  nginx:
    image: nginx:alpine
    container_name: easypay-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - easypay
    networks:
      - easypay-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  easypay-network:
    driver: bridge
