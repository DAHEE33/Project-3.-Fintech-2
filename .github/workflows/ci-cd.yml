name: EasyPay PR Checks

on:
  push:
    branches: [ dahee ]         # ← 브랜치 변경
  pull_request:
    branches: [ dahee ]         # ← 브랜치 변경

env:
  JAVA_VERSION: '21'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run tests
        run: ./gradlew test
      - name: Build (skip tests)
        run: ./gradlew build -x test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: SpotBugs
        run: ./gradlew spotbugsMain
      - name: PMD
        run: ./gradlew pmdMain
      - name: Upload SpotBugs results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-results
          path: build/reports/spotbugs/
          retention-days: 30
      - name: Upload PMD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-results
          path: build/reports/pmd/
          retention-days: 30

  pr-summary:
    runs-on: ubuntu-latest
    needs: [test-and-build, code-quality]
    if: github.event_name == 'pull_request'
    steps:
      - name: PR Summary
        run: |
          echo "✅ EasyPay PR Checks Completed!"
          echo "📊 Test Results: artifacts 에 업로드됨"
          echo "🔍 Code Quality: SpotBugs/PMD 업로드됨"
