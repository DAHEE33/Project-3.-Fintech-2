version: '3.8'

services:
  easypay-8081:
    build: 
      context: .
      dockerfile: Dockerfile
    image: easypay:latest
    container_name: fintech-app-8081
    ports:
      - "8081:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/easypay}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-easypay}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-easypay123}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - easypay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  easypay-8082:
    build: 
      context: .
      dockerfile: Dockerfile
    image: easypay:latest
    container_name: fintech-app-8082
    ports:
      - "8082:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/easypay}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-easypay}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-easypay123}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - easypay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: fintech-db
    environment:
      - POSTGRES_DB=easypay
      - POSTGRES_USER=easypay
      - POSTGRES_PASSWORD=easypay123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - easypay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypay -d easypay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: easypay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - easypay-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  easypay-network:
    driver: bridge
