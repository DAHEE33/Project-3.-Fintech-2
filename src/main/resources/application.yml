spring:
  application:
    name: easypay
  
  # PostgreSQL 설정 (환경변수에서 주입)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easypay}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 개발환경에서는 update 사용
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

#jwt:
#  expiration: 86400000

# 외부 은행 API 설정
external:
  banking:
    api:
      base-url: https://api.banking.example.com
      timeout: 30000
      key: ${BANKING_API_KEY:test-api-key}

logging:
  level:
    org.springframework.security: DEBUG
    fintech2.easypay: DEBUG